name: "Recipe Manager"
version: "1.3.2"
slug: "recipe_manager"
description: "Recipe manager with import from YouTube Shorts, Markdown files, and URLs"
url: "https://github.com/ebloved/recipe-manager-addon"
arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8099
panel_icon: "mdi:chef-hat"
panel_title: "Recipes"
panel_admin: false

startup: "application"
boot: "auto"
init: false
host_network: false

options:
  # --- Основное -------------------------------------------------------------
  log_level: "info"

  # --- Gemini ---------------------------------------------------------------
  gemini_api_key: ""
  gemini_models: "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash"
  gemini_proxy: ""

  # --- yt-dlp ---------------------------------------------------------------
  sub_langs: "ru.*"
  cookies_file: ""

  # --- GitHub sync ----------------------------------------------------------
  github_repo: ""
  github_username: ""
  github_token: ""
  github_branch: "main"
  github_path: "recipes.json"
  github_ingredients_path: "ingredients.json"

  # --- Matcher: общий режим -------------------------------------------------
  matcher_provider: "auto"
  matcher_auto_threshold: 0.95
  matcher_suggest_threshold: 0.80
  matcher_daily_limit: 200
  matcher_confirm_mode: "single"

  # --- Matcher: внешний OpenAI-совместимый endpoint -------------------------
  # Универсальный OpenAI-совместимый endpoint.
  # Подходит для Hermes, Ollama, LM Studio, vLLM и других локальных
  # серверов. Для OpenRouter и Groq есть отдельные опции ниже.
  matcher_external_enabled: false
  matcher_external_url: ""
  matcher_external_key: ""
  matcher_external_model: "hermes-agent"
  matcher_external_embedding_model: ""
  matcher_external_timeout: 15

  # --- Matcher: fallback-эмбеддинги OpenRouter ------------------------------
  openrouter_api_key: ""
  openrouter_embedding_model: "openai/text-embedding-3-small"

  # --- Matcher: fallback-эмбеддинги Groq ------------------------------------
  groq_api_key: ""
  groq_embedding_model: "nomic-embed-text-v1_5"

  # --- Matcher: локальные эмбеддинги (sentence-transformers) ----------------
  local_embedder_enabled: false
  local_embedder_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  local_embedder_onnx: true
  local_embedder_max_concurrent: 1

  # --- Backup ---------------------------------------------------------------
  backup_enabled: true
  backup_keep_days: 7
  backup_interval_hours: 24


schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

  gemini_api_key: "password"
  gemini_models: "str"
  gemini_proxy: "str?"

  sub_langs: "str"
  cookies_file: "str?"

  github_repo: "str?"
  github_username: "str?"
  github_token: "password?"
  github_branch: "str?"
  github_path: "str?"
  github_ingredients_path: "str?"

  matcher_provider: "list(auto|gemini|external|local|none)"
  matcher_auto_threshold: "float(0.5,1.0)"
  matcher_suggest_threshold: "float(0.5,1.0)"
  matcher_daily_limit: "int(0,5000)"
  matcher_confirm_mode: "list(single|batch|auto)"

  matcher_external_enabled: "bool"
  matcher_external_url: "str?"
  matcher_external_key: "password?"
  matcher_external_model: "str?"
  matcher_external_embedding_model: "str?"
  matcher_external_timeout: "int(1,120)"

  openrouter_api_key: "password?"
  openrouter_embedding_model: "str?"

  groq_api_key: "password?"
  groq_embedding_model: "str?"

  local_embedder_enabled: "bool"
  local_embedder_model: "str?"
  local_embedder_onnx: "bool"
  local_embedder_max_concurrent: "int(1,8)"

  backup_enabled: "bool"
  backup_keep_days: "int(1,90)"
  backup_interval_hours: "int(1,168)"


map:
  - type: share
    read_only: false
  - type: ssl
    read_only: false