name: "Recipe Manager"
version: "1.2.0"
slug: "recipe_manager"
description: "Recipe manager with import from YouTube Shorts, Markdown files, and URLs"
url: "https://github.com/ebloved/recipe-manager-addon"
arch:
  - aarch64
  - amd64
  - armv7

ingress: true
ingress_port: 8099
panel_icon: "mdi:chef-hat"
panel_title: "Recipes"
panel_admin: false

startup: "application"
boot: "auto"
init: false
host_network: false

options:
  gemini_api_key: ""
  gemini_models: "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash"
  gemini_proxy: ""
  sub_langs: "ru.*"
  cookies_file: ""
  log_level: "info"
  github_repo: ""
  github_username: ""
  github_token: ""
  github_branch: "main"
  github_path: "data/recipes.json"

schema:
  gemini_api_key: "password"
  gemini_models: "str"
  gemini_proxy: "str?"
  sub_langs: "str"
  cookies_file: "str?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  github_repo: "str?"
  github_username: "str?"
  github_token: "password?"
  github_branch: "str?"
  github_path: "str?"

map:
  - type: share
    read_only: false
  - type: ssl
    read_only: false