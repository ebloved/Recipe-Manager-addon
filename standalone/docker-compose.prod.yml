services:
  recipe-manager-prod:
    build:
      context: ..
      dockerfile: standalone/Dockerfile
    container_name: rm-prod
    ports:
      - "8199:8099"
    volumes:
      - ./data-prod:/data
      - ./hf_cache:/hf_cache
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped